[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hotelmind-ai"
version = "0.2.0"
description = "Explainable hotel cancellation intelligence: real-data benchmarks, XGBoost, SHAP and a working dashboard."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
keywords = ["machine-learning", "hotel", "cancellation-prediction", "fastapi"]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.0,<3",
    "scikit-learn>=1.4,<2",
    "joblib>=1.3,<2",
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
    "pydantic>=2.5,<3",
    "xgboost>=2.1,<4",
    "shap>=0.46,<1",
    "threadpoolctl>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
